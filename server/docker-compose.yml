# Two services: the llama.cpp LLM server and the Python gateway (which embeds
# the BiCodec vocoder). Put the GGUF in ./models before running:
#   python -m server.download_models --gguf bambara-tts-Q4_K_M.gguf
#
#   docker compose -f server/docker-compose.yml up --build
#
# Then: curl -X POST localhost:8000/tts -H 'content-type: application/json' \
#         -d '{"text":"Aw ni ce","speaker":"Bourama"}' --output hello.wav

services:
  llama:
    # CUDA image (the plain :server tag is CPU-only). Requires the NVIDIA
    # Container Toolkit on the host:  sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/bambara-tts-Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      --ctx-size 4096 --parallel 2
      --n-gpu-layers 99
      --special --no-webui
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      LLAMA_SERVER_URL: "http://llama:8080"
      SPARK_MODEL_DIR: "/models/Spark-TTS-0.5B"
      TTS_DEVICE: "cpu"
    volumes:
      - ../models:/models
    ports:
      - "8000:8000"
    depends_on:
      llama:
        condition: service_healthy
